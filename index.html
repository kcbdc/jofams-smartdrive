<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="다임·순식·훈민과 함께하는 조팸스 스마트 드라이브" />
  <title>조팸스 스마트 드라이브</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="내비게이션 지도"></div>

    <!-- HOME -->
    <section id="homeView" class="screen home-view">
      <header class="home-header">
        <button id="menuBtn" class="circle-btn" aria-label="메뉴"><span data-icon="menu"></span></button>
        <b>조팸스 스마트 드라이브</b>
        <button id="myBtn" class="circle-btn" aria-label="마이페이지"><span data-icon="user"></span></button>
      </header>

      <div class="home-sheet">
        <h1>어디로 이동할까요?</h1>
        <div class="search-box">
          <span class="search-icon" data-icon="search"></span>
          <input id="destinationInput" autocomplete="off" placeholder="장소, 주소 검색" />
          <button id="searchBtn" aria-label="검색"><span data-icon="arrow-right"></span></button>
        </div>
        <div id="searchResults" class="search-results hidden"></div>

        <div class="shortcut-row">
          <button id="homeShortcut"><span data-icon="home"></span><b>집</b><small id="homeLabel">등록</small></button>
          <button id="workShortcut"><span data-icon="office"></span><b>회사</b><small id="workLabel">등록</small></button>
          <button id="favoriteShortcut"><span data-icon="star"></span><b>즐겨찾기</b><small id="favoriteLabel">0곳</small></button>
        </div>

        <section class="home-block">
          <div class="block-title"><b>최근 목적지</b><span>자주 가는 곳을 빠르게</span></div>
          <button class="recent-item" data-query="한국조폐공사 본사"><span class="recent-dot"></span><span><b>한국조폐공사 본사</b><small>대전광역시 유성구 과학로 80-67</small></span><i data-icon="chevron"></i></button>
          <button class="recent-item" data-query="대전역"><span class="recent-dot blue"></span><span><b>대전역</b><small>대전광역시 동구 중앙로 215</small></span><i data-icon="chevron"></i></button>
        </section>

        <section class="home-block guide-block">
          <div class="block-title"><b>조팸스 가이드 선택</b><span>선택한 가이드가 차량으로 길을 안내해요</span></div>
          <div class="guide-grid">
            <button class="guide-card active" data-character="daim"><img src="/assets/daim_car.png" alt="다임 자동차"><span><b>다임</b><small>정확하고 차분하게</small></span></button>
            <button class="guide-card" data-character="sunsik"><img src="/assets/sunsik_car.png" alt="순식 자동차"><span><b>순식</b><small>교통 흐름을 빠르게</small></span></button>
            <button class="guide-card" data-character="hunmin"><img src="/assets/hunmin_car.png" alt="훈민 자동차"><span><b>훈민</b><small>재탐색을 명확하게</small></span></button>
          </div>
        </section>
      </div>
    </section>

    <!-- ROUTE SELECTION -->
    <section id="routeView" class="screen route-view hidden">
      <header class="route-header">
        <button id="routeBackBtn" class="circle-btn"><span data-icon="back"></span></button>
        <div><b>경로 선택</b><small id="routeDestinationName">목적지</small></div>
        <button id="routeFavoriteBtn" class="circle-btn"><span data-icon="star-outline"></span></button>
      </header>
      <div class="route-sheet">
        <div class="route-addresses">
          <div><span class="point start"></span><small>출발</small><b>내 위치</b></div>
          <div><span class="point end"></span><small>도착</small><b id="routeAddressDest">목적지</b></div>
        </div>
        <div id="routeCards" class="route-cards"></div>
        <button id="startBtn" class="primary-btn">안내 시작</button>
        <div id="autoStartHint" class="auto-start-hint">3초 후 자동으로 안내를 시작합니다.</div>
      </div>
    </section>

    <!-- DRIVE / TMAP-LIKE CORE -->
    <section id="driveView" class="screen drive-view hidden">
      <div class="maneuver-stack">
        <div class="maneuver-main">
          <div id="maneuverIcon" class="maneuver-svg"></div>
          <div><b id="maneuverDistance">--m</b><span id="maneuverRoad">경로 안내</span></div>
        </div>
        <div id="nextManeuver" class="maneuver-next hidden"><span id="nextManeuverIcon"></span><b id="nextManeuverDistance">--m</b><small id="nextManeuverText">다음 안내</small></div>
      </div>

      <button id="driveVoiceBtn" class="floating-voice" aria-label="음성안내"><span data-icon="mic"></span></button>

      <div id="speedPanel" class="speed-panel hidden">
        <div class="speed-limit"><small>제한</small><b id="speedLimit">--</b></div>
        <strong id="currentSpeed">0</strong><span>km/h</span>
      </div>

      <div class="drive-bottom-card">
        <button id="driveRefreshBtn" class="drive-bottom-icon" aria-label="재탐색"><span data-icon="refresh"></span></button>
        <div class="drive-bottom-summary">
          <small id="currentRoadLabel">일반도로</small>
          <div><b id="remainingTime">--분</b><b id="remainingDistance">--km</b></div>
          <span id="arrivalTime">도착 --:--</span>
        </div>
        <button id="driveMenuBtn" class="drive-bottom-icon" aria-label="주행 메뉴"><span data-icon="menu"></span></button>
      </div>
    </section>

    <!-- SIMPLE DRIVE MENU -->
    <div id="driveMenu" class="bottom-modal hidden">
      <div class="bottom-modal-backdrop"></div>
      <section class="bottom-modal-sheet">
        <div class="modal-handle"></div>
        <div class="guide-volume-row">
          <div><b>길안내 볼륨</b><small id="volumeValue">80%</small></div>
          <input id="guideVolume" type="range" min="0" max="100" value="80" />
        </div>
        <div class="drive-menu-actions">
          <button id="otherRouteBtn"><span data-icon="routes"></span><b>다른경로</b></button>
          <button id="driveSettingBtn"><span data-icon="settings"></span><b>주행설정</b></button>
          <button id="shareBtn"><span data-icon="share"></span><b>도착공유</b></button>
        </div>
        <button id="endNavBtn" class="end-nav-btn">안내종료</button>
      </section>
    </div>

    <!-- MY -->
    <div id="myModal" class="modal hidden">
      <section class="my-sheet">
        <header class="my-header">
          <button id="myCloseBtn" class="circle-btn"><span data-icon="close"></span></button>
          <b>마이페이지 / 설정</b>
          <span></span>
        </header>
        <div class="profile-card">
          <div class="profile-photo"><img id="profilePhoto" src="/assets/daim.png" alt="프로필"></div>
          <div><b id="profileName">조팸스 드라이버</b><small id="profileEmail">Google 로그인으로 동기화할 수 있어요.</small></div>
          <button id="googleLoginBtn">Google 로그인</button>
          <button id="logoutBtn" class="hidden">로그아웃</button>
        </div>
        <div class="setting-list">
          <button id="myFavoritesBtn"><span data-icon="star-outline"></span><span><b>즐겨찾기</b><small id="myFavoriteCount">0곳 저장</small></span><i data-icon="chevron"></i></button>
          <button><span data-icon="volume"></span><span><b>음성 가이드</b><small id="voiceCharacterLabel">다임 보이스</small></span><i data-icon="chevron"></i></button>
          <div class="volume-setting"><input id="myGuideVolume" type="range" min="0" max="100" value="80"><b id="myVolumeValue">80%</b></div>
          <button><span data-icon="car"></span><span><b>가이드 캐릭터</b><small id="myCharacterLabel">다임</small></span><i data-icon="chevron"></i></button>
        </div>
      </section>
    </div>

    <!-- PLACE REGISTRATION -->
    <div id="placeModal" class="modal hidden">
      <section class="simple-sheet">
        <header><b id="placeModalTitle">장소 등록</b><button id="placeModalClose" class="circle-btn"><span data-icon="close"></span></button></header>
        <div class="search-box"><span data-icon="search"></span><input id="placeSearchInput" placeholder="장소 또는 주소 검색"><button id="placeSearchBtn"><span data-icon="arrow-right"></span></button></div>
        <div id="placeSearchResults" class="search-results"></div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.js"></script>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
